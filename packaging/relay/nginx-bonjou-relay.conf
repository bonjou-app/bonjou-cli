# nginx vhost for the Bonjou Web coordinator.
#
# Runs on its own hostname so it never interferes with anything else
# already served from this box. Certbot appends the TLS directives on
# first issuance.

server {
    listen 80;
    listen [::]:80;
    server_name RELAY_HOSTNAME;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name RELAY_HOSTNAME;

    # Candidate membership and opaque encrypted WebRTC signaling.
    location /ws {
        proxy_pass http://127.0.0.1:46330;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /healthz {
        proxy_pass http://127.0.0.1:46330;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        return 404;
    }
}
