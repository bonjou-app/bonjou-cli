name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: Go (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go build ./cmd/bonjou ./cmd/bonjou-relay

  browser-compatibility:
    name: Browser compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: cli
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bonjou-app/bonjou-web
          ref: 09f0869352d6d22a11f2a2185003fd4d4ef13875
          path: web
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Test the browser against this change's Go vectors
        run: |
          npm ci --prefix web
          cp cli/internal/network/testdata/protocol-v2.json web/src/share/vectors/protocol-v2.json
          npm test --prefix web
      - name: Check encrypted transfers through the Go relay
        working-directory: cli
        shell: bash
        run: |
          set -euo pipefail
          go build -o "$RUNNER_TEMP/bonjou-relay" ./cmd/bonjou-relay
          "$RUNNER_TEMP/bonjou-relay" -trust-proxy=false -log-dir "$RUNNER_TEMP/relay-logs" &
          relay_pid=$!
          trap 'kill "$relay_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:46330/healthz >/dev/null; then break; fi
            sleep 1
          done
          npm run smoke --prefix ../web
